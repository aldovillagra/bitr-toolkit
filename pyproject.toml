[project]
name = "bitr-toolkit"
version = "0.1.0"
description = "Proyecto bitr-toolkit"
authors = [
  { name = "Aldo A. Villagra B.", email = "aldovillagra@gmail.com" }
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">= 3.14"

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.15",
    "python-dotenv>=1.2",
    "tomli-w>=1.2.0",
    "typer>=0.27",
    "rich>=15.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "ipdb",
    "debugpy",
    "ipython",
    "ptpython",
    "mypy",
    "isort",
    "ipython",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "pytest-mock",
    "faker",
    "hypothesis",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings",
    "mkdocstrings-python",
]

# Script
# [project.scripts]
# bitr_toolkit = "bitr_toolkit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# addopts = [
#     "-ra",
#     "--strict-markers",
#     "--strict-config",
#     "--cov=bitr_toolkit",
#     "--cov-report=term-missing",
#     "--cov-report=html",
#     "--cov-report=xml",
# ]

[tool.coverage.run]
branch = true
source = ["3.14"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.hatch.envs.test]
installer = "uv"
dependencies = [
    "pytest",
    "pytest-cov",
]

[[tool.hatch.envs.test.matrix]]
python = ["3.12", "3.13", "3.14"]

[tool.hatch.envs.test.scripts]
run = "pytest"
cov = "pytest --cov=3.14 --cov-report=term-missing"
